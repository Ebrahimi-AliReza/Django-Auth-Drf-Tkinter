```html
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 | صفحه پیدا نشد</title>

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Vazirmatn',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#6C63FF,#4FACFE,#00F2FE);
    overflow:hidden;
}

.circle{
    position:absolute;
    border-radius:50%;
    background:rgba(255,255,255,.15);
    animation:move 8s infinite alternate;
}

.circle:nth-child(1){
    width:220px;
    height:220px;
    top:10%;
    left:10%;
}

.circle:nth-child(2){
    width:150px;
    height:150px;
    bottom:15%;
    right:12%;
    animation-duration:6s;
}

.circle:nth-child(3){
    width:100px;
    height:100px;
    top:25%;
    right:25%;
    animation-duration:10s;
}

@keyframes move{
    from{transform:translateY(0);}
    to{transform:translateY(-40px);}
}

.card{
    width:90%;
    max-width:650px;
    padding:60px 40px;
    text-align:center;
    background:rgba(255,255,255,.12);
    backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,.25);
    border-radius:30px;
    color:#fff;
    box-shadow:0 20px 60px rgba(0,0,0,.25);
}

h1{
    font-size:120px;
    line-height:1;
    font-weight:700;
    text-shadow:0 10px 20px rgba(0,0,0,.2);
}

h2{
    margin-top:15px;
    font-size:32px;
}

p{
    margin:20px auto 35px;
    line-height:2;
    max-width:500px;
    color:#f3f3f3;
}

a{
    display:inline-block;
    text-decoration:none;
    background:#fff;
    color:#4f46e5;
    padding:15px 35px;
    border-radius:50px;
    font-weight:700;
    transition:.3s;
}

a:hover{
    transform:translateY(-5px);
    box-shadow:0 15px 30px rgba(0,0,0,.2);
}

.emoji{
    font-size:70px;
    margin-bottom:15px;
    animation:shake 2s infinite;
}

@keyframes shake{
    0%,100%{transform:rotate(0);}
    25%{transform:rotate(-10deg);}
    75%{transform:rotate(10deg);}
}
</style>
</head>

<body>

<div class="circle"></div>
<div class="circle"></div>
<div class="circle"></div>

<div class="card">

    <div class="emoji">🚀</div>

    <h1>404</h1>

    <h2>اوه! این صفحه پیدا نشد.</h2>

    <p>
        به نظر می‌رسد صفحه‌ای که به دنبال آن هستید حذف شده،
        تغییر آدرس داده یا اصلاً وجود ندارد.
    </p>

    <a href="/">🏠 بازگشت به صفحه اصلی</a>

</div>

</body>
</html>
```
