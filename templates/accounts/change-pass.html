{% extends "base.html" %}
{% load static %}
{% block 'title' %}Change Password{% endblock %}

{% block 'content' %}

<style>
    .change-password-box{
        width:450px;
        margin:120px auto 80px;
        background:#fff;
        padding:35px;
        border-radius:15px;
        box-shadow:0 8px 25px rgba(0,0,0,.15);
    }

    .change-password-box h2{
        text-align:center;
        margin-bottom:30px;
        color:#2c3e50;
        font-weight:bold;
    }

    .form-group{
        margin-bottom:20px;
    }

    .form-group label{
        display:block;
        margin-bottom:8px;
        font-weight:600;
        color:#444;
    }

    .form-group input{
        width:100%;
        padding:12px;
        border:1px solid #ccc;
        border-radius:8px;
        font-size:15px;
        transition:.3s;
    }

    .form-group input:focus{
        outline:none;
        border-color:#28a745;
        box-shadow:0 0 5px rgba(40,167,69,.4);
    }

    .btn-change{
        width:100%;
        padding:12px;
        background:#28a745;
        color:white;
        border:none;
        border-radius:8px;
        font-size:17px;
        cursor:pointer;
        transition:.3s;
    }

    .btn-change:hover{
        background:#218838;
    }

    .msg{
        margin-top:20px;
        text-align:center;
        color:red;
        font-weight:bold;
    }
</style>

<div class="change-password-box">

    <h2>🔒 Change Password</h2>

    <form method="POST">

        {% csrf_token %}

        <div class="form-group">
            <label>Current Password</label>
            <input type="password"
                   name="current_password"
                   placeholder="Current password">
        </div>

        <div class="form-group">
            <label>New Password</label>
            <input type="password"
                   name="password1"
                   placeholder="New password">
        </div>

        <div class="form-group">
            <label>Confirm New Password</label>
            <input type="password"
                   name="password2"
                   placeholder="Confirm new password">
        </div>

        <button class="btn-change" type="submit">
            Change Password
        </button>

    </form>

    {% if messages %}
        <div class="msg">
            {% for message in messages %}
                {{ message }}
            {% endfor %}
        </div>
    {% endif %}

</div>

{% endblock %}
