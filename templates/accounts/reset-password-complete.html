{% extends "base.html" %}
{% load static %}

{% block 'title' %}Password Changed{% endblock %}

{% block 'content' %}

<style>
    .success-box{
        width:500px;
        margin:120px auto 80px;
        background:#fff;
        padding:40px;
        border-radius:15px;
        text-align:center;
        box-shadow:0 8px 25px rgba(0,0,0,.15);
    }

    .icon{
        font-size:65px;
        margin-bottom:20px;
    }

    .success-box h2{
        color:#28a745;
        margin-bottom:15px;
    }

    .success-box p{
        color:#555;
        font-size:16px;
        line-height:1.8;
        margin-bottom:30px;
    }

    .btn-login{
        display:inline-block;
        padding:12px 30px;
        background:#28a745;
        color:white;
        text-decoration:none;
        border-radius:8px;
        transition:.3s;
        font-size:16px;
    }

    .btn-login:hover{
        background:#218838;
        color:white;
    }
</style>

<div class="success-box">

    <div class="icon">🎉🔐</div>

    <h2>Password Changed Successfully</h2>

    <p>
        Your password has been changed successfully.
        <br>
        You can now sign in using your new password.
    </p>

    <a href="{% url 'accounts:login' %}" class="btn-login">
        Go to Login
    </a>

</div>

{% endblock %}
